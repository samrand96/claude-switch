<h2>Almost done</h2>
<p>Open <b>Terminal</b> and run:</p>
<pre>cswitch</pre>
<p>The setup wizard creates your profiles (e.g. work and personal), picks a sign-in browser for
each, and adds the <code>claude-work</code> / <code>claude-personal</code> commands.</p>
<p>To uninstall later: run <code>cswitch uninstall</code>, then
<code>sudo /usr/local/claude-switch/uninstall.sh</code>.</p>
</body>
