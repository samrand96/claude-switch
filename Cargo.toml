[package]
name = "claude-switch"
version = "0.1.0"
edition = "2024"
description = "Run your work and personal Claude (Claude Code + Claude Desktop) side by side, fully isolated."
license = "MIT"
repository = "https://github.com/samrand96/claude-switch"
readme = "README.md"
keywords = ["claude", "claude-code", "profiles", "multi-account", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "cswitch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
console = "0.16.6"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shell-words = "1.1.1"
sysinfo = "0.39.6"
toml = "1.1.8"
which = "8.0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
