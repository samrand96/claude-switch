name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner also lints the release target it cross-compiles, so all six release
          # builds (x86_64 + arm64 on every OS) are checked on every change.
          - os: ubuntu-latest
            cross: aarch64-unknown-linux-musl
          - os: windows-latest
            cross: aarch64-pc-windows-msvc
          - os: macos-latest
            cross: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.cross }}
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (${{ matrix.cross }})
        run: cargo clippy --locked --all-targets --target ${{ matrix.cross }} -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v7
        with:
          name: cswitch-${{ matrix.os }}
          path: |
            target/release/cswitch
            target/release/cswitch.exe
          if-no-files-found: ignore
